# Marquee —— XcodeGen 工程定义
#
# .xcodeproj 是生成物，不入库。改动工程配置一律改这里，然后 `xcodegen generate`。
# 模块边界见 Modules/Package.swift。

name: Marquee

options:
  bundleIdPrefix: com.tango
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # 源语言＝简体中文：`L10n.t("矩形")` 的 key 就是那句中文，
  # 英文由 `App/Resources/Localizable.xcstrings` 提供（见 ticket 17b）。
  developmentLanguage: zh-Hans

# 三个配置，各司其职（设计见 docs/DEV-VS-PROD.md）：
#
#   Debug    只用于跑测试（单元测试走 SwiftPM，基本用不到它）
#   Dev      **本地运行** —— scheme 的 Run 指它。与 Release 同样的优化设置，
#            但 bundle id 带 `.dev` 后缀 ⇒ 偏好、数据、屏幕录制授权**自动隔离**
#   Release  发版 / 打包 / 沙盒内购验证
#
# ⚠️ 为什么 Run 不用 `Release`（改名前就是这么干的）：改名前 Run 走 Release，
# 于是"本地跑的那个"与"要上架的那个"是同一个身份 —— 调试开关会留在正式版偏好里、
# 调试删除逻辑删掉的是真实历史。现在 Run 走 `Dev`，代价只有一个：**内购的真实沙盒验证
# 要在 Release 构建上做**（商品挂 bundle id，见 docs/DEV-VS-PROD.md §3.2）。
configs:
  Debug: debug
  Dev: release
  Release: release

packages:
  MarqueeModules:
    path: Modules

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# ⚠️ 必须显式声明 scheme。
#
# 曾经能用 `xcodebuild -scheme Marquee` 是**碰巧**：Xcode 打开工程时会自动建一个
# 用户级 scheme（在 `xcuserdata/` 里）。但 `xcodegen generate` 重新生成工程后它就不在了，
# 于是 `xcodebuild -scheme Marquee` 直接报
# `The project named "Marquee" does not contain a scheme named "Marquee"`。
# 声明成共享 scheme 后，工程每次生成结果都是确定的，谁 clone 下来都能直接构建。
schemes:
  Marquee:
    build:
      targets:
        Marquee: all
    run:
      # Run 走 **Dev**（而不是 Release）：性能预算（落点→剪贴板 ≤150 ms、选区拖拽 120fps、
      # 编辑器重绘 ≤4 ms）只有在优化构建下才有意义，所以它**照抄 Release 的优化设置**；
      # 但身份是 `com.tango.Marquee.dev`，于是本地跑出来的东西**不会碰正式版的数据与偏好**。
      #
      # 代价：调试体验下降（优化构建下断点与变量查看会被打乱）。
      # 需要单步排查时临时改成 Debug，或直接切 scheme 的 Run 配置。
      config: Dev
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Marquee:
    type: application
    platform: macOS
    sources:
      # `syncedFolder` = Xcode 16+ 的「文件系统同步组」（PBXFileSystemSynchronizedRootGroup）。
      #
      # ⚠️ 别改回普通的 `- path: App/Sources`（那是一堆逐个列出的 `PBXFileReference`）。
      #
      # 踩过的坑（2026-10-01）：新增 `App/Sources/EditorDemo.swift` 之后忘了跑
      # `xcodegen generate`，从 **Xcode 里直接 Run** 就报「找不到 EditorDemo」——
      # 因为 Xcode Run 不会替你重新生成工程，它只读当前的 `.xcodeproj`。
      # 这类问题很隐蔽：文件明明在磁盘上、`git` 里也有，只是工程没引用它。
      #
      # 同步组把目录本身挂进工程，增删源文件**不需要重新生成工程**，从根上去掉这类错误。
      # 只有 `project.yml` 本身（build settings / scheme / 依赖）变了才需要重新生成。
      - path: App/Sources
        type: syncedFolder
      # 文案资源**刻意不放 `App/Sources`**：同步组里的文件由 Xcode 按类型归类，
      # 而 `.xcstrings` 是不是稳当地进 Resources 阶段没有人能替我验证（本机跑不了 xcodebuild）。
      # 显式列出来 + `buildPhase: resources`，归类是生成工程时就定死的，不靠猜。
      - path: App/Resources
        buildPhase: resources
      # 图标资源（ticket 29）。**与 `App/Resources` 分开放、也显式声明**：
      # `.xcassets` 是要过 `actool` 编译的，不能和一堆普通资源混在一个目录里等归类。
      # 同样不走 syncedFolder —— 本机跑不了 xcodebuild，它在不在 Resources 阶段
      # 必须钉在生成工程那一刻（与 `.xcstrings` 同一条理由）。
      - path: App/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: MarqueeModules
        product: MarqueeCore
      - package: MarqueeModules
        product: MarqueeCapture
      - package: MarqueeModules
        product: MarqueeOverlay
      - package: MarqueeModules
        product: MarqueeEditor
      - package: MarqueeModules
        product: MarqueeSettings
      - package: MarqueeModules
        product: MarqueeHistory
    settings:
      base:
        PRODUCT_NAME: Marquee
        PRODUCT_BUNDLE_IDENTIFIER: com.tango.Marquee
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        # ⚠️ 必须用**证书**签名，不要用 ad-hoc（"-"）。
        #
        # 原因（已实测）：TCC 的屏幕录制授权按「bundle id + 代码签名身份」记账；
        # ad-hoc 没有身份，macOS 只能退回按 cdhash 记账 —— 而每次重新构建 cdhash 都变，
        # 于是每次 Run/构建都被当成一个**新应用**，屏幕录制权限反复索要、勾选也留不住。
        #
        # `DEVELOPMENT_TEAM` 必须是**真正的 team id（UKXWZ3FS84）**。
        # 别把证书名括号里的那串（`Apple Development: … (7H6TJ2PN25)`）填进来 ——
        # 那是证书自身的标识，不是 team id，填错会报
        # `No signing certificate "Mac Development" found`。
        # 查可用身份：`security find-identity -v -p codesigning`
        # 详见 docs/DEV-NOTES.md 第 1 节。
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: UKXWZ3FS84
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        # 图标（ticket 29）。之前这里是**空串**，等于"这个 app 没有图标" ——
        # 在 Dock / 访达 / App Store 里都会显示成一张白纸。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # 开发身份。Debug 也给 `.dev`：它虽然基本只用于跑测试，
        # 但万一有人用 Debug 起 app，也不该碰到正式版的数据。
        # **只有 Release 拿得到生产 id** —— 于是"误把开发构建发出去"这件事
        # 从"靠人记得"变成"配置上就不可能"（package.sh 另有一道前置检查）。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tango.Marquee.dev
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.tango.Marquee.dev
