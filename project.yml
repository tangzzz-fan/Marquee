# Marquee —— XcodeGen 工程定义
#
# .xcodeproj 是生成物，不入库。改动工程配置一律改这里，然后 `xcodegen generate`。
# 模块边界见 Modules/Package.swift。

name: Marquee

options:
  bundleIdPrefix: dev.tango
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

packages:
  MarqueeModules:
    path: Modules

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Marquee:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
    dependencies:
      - package: MarqueeModules
        product: MarqueeCore
      - package: MarqueeModules
        product: MarqueeCapture
      - package: MarqueeModules
        product: MarqueeOverlay
      - package: MarqueeModules
        product: MarqueeEditor
      - package: MarqueeModules
        product: MarqueeSettings
      - package: MarqueeModules
        product: MarqueeHistory
    settings:
      base:
        PRODUCT_NAME: Marquee
        PRODUCT_BUNDLE_IDENTIFIER: dev.tango.Marquee
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        # Xcode 这边保持 ad-hoc（最省事、不会因为没有匹配的 provisioning profile 而构建失败），
        # 真正的**稳定签名**由 scripts/build.sh 在构建后用证书重签一次。
        #
        # 为什么必须重签：ad-hoc 没有稳定身份，macOS 的 TCC 只能退回按 cdhash 记账，
        # 而每次重新构建 cdhash 都变 → 屏幕录制权限每次都要重新授权。
        # `security find-identity -v -p codesigning` 可查可用身份。
        # 详见 docs/DEV-NOTES.md 第 1 节。
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
