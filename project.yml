# Marquee —— XcodeGen 工程定义
#
# .xcodeproj 是生成物，不入库。改动工程配置一律改这里，然后 `xcodegen generate`。
# 模块边界见 Modules/Package.swift。

name: Marquee

options:
  bundleIdPrefix: com.tango
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # 源语言＝简体中文：`L10n.t("矩形")` 的 key 就是那句中文，
  # 英文由 `App/Resources/Localizable.xcstrings` 提供（见 ticket 17b）。
  developmentLanguage: zh-Hans

# 四个配置（2026-10-03 起加了 `MAS`，逐项对比见 docs/DEV-VS-PROD.md §4.1）：
#
#   Dev      **本地运行**（scheme 的 Run 指它）。与 Release **同一套优化设置**，
#            但 bundle id 带 `.dev` 后缀 ⇒ 偏好、数据、屏幕录制授权自动隔离。
#            要"手感与发版一致"又不想碰正式数据，就用它。
#   Debug    未优化（`-Onone`）+ 可调试。**本项目里它的唯一用途**是
#            "要能用的断点"时把 Run 临时切过来 —— 工程里**没有 test target**
#            （单元测试走 SwiftPM），所以 scheme 的 Test / Analyze 两个 action 基本是空转。
#            ⚠️ 别拿它测性能：`-Onone` 下的帧率与耗时没有参考价值（这正是 `Dev` 存在的理由）。
#   Release  **Developer ID** 那条路（`scripts/package.sh`：归档 → 导出 → 公证 → DMG）。
#            与 Dev/Debug 一样**不带沙盒** —— 因为这条路存在的全部价值就是
#            保住自动滚动（沙盒禁止向其它 app 投递输入事件）。
#   MAS      **App Store** 那条路。**只有它带沙盒**（hardened runtime 四份都开）。
#            代价（已接受，见 docs/MAS-AND-MONETIZATION.md）：自动滚动关闭、
#            默认落盘改 ~/Pictures/Marquee、数据进容器。
#
# ⚠️ 「在不在沙盒里」**不许**用编译期开关分派（`#if` / 配置名）：
# 那样同一份代码在两个构建里行为不同，而**没编进去的那条分支只有发版那天才跑得到**。
# 用 `AppIdentity.isSandboxed`（运行期读 APP_SANDBOX_CONTAINER_ID，能脱机单测）。
#
# 身份：**只有 `Release` 与 `MAS` 是正式 id**；`Dev` 与 `Debug` 都是 `com.tango.marquee.dev`。
# 所以从 Debug 切到 Dev 不会多出一个身份 —— 数据、偏好、TCC 授权都还是同一份。
#
# ⚠️ 为什么 Run 不用 `Release`（改名前就是这么干的）：那时"本地跑的那个"与
# "要上架的那个"是同一个身份 —— 调试开关会留在正式版偏好里、调试删除逻辑删掉的是真实历史。
# 改走 `Dev` 的代价只有一个：**内购的真实沙盒验证要在 Release 构建上做**
# （商品挂 bundle id，见 docs/DEV-VS-PROD.md §3.2）。
configs:
  Debug: debug
  Dev: release
  Release: release
  MAS: release

packages:
  MarqueeModules:
    path: Modules

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# ⚠️ 必须显式声明 scheme。
#
# 曾经能用 `xcodebuild -scheme Marquee` 是**碰巧**：Xcode 打开工程时会自动建一个
# 用户级 scheme（在 `xcuserdata/` 里）。但 `xcodegen generate` 重新生成工程后它就不在了，
# 于是 `xcodebuild -scheme Marquee` 直接报
# `The project named "Marquee" does not contain a scheme named "Marquee"`。
# 声明成共享 scheme 后，工程每次生成结果都是确定的，谁 clone 下来都能直接构建。
schemes:
  Marquee:
    build:
      targets:
        Marquee: all
    run:
      # Run 走 **Dev**（而不是 Release）：性能预算（落点→剪贴板 ≤150 ms、选区拖拽 120fps、
      # 编辑器重绘 ≤4 ms）只有在优化构建下才有意义，所以它**照抄 Release 的优化设置**；
      # 但身份是 `com.tango.marquee.dev`，于是本地跑出来的东西**不会碰正式版的数据与偏好**。
      #
      # 代价：调试体验下降（优化构建下断点与变量查看会被打乱）。
      # 需要单步排查时临时改成 Debug，或直接切 scheme 的 Run 配置。
      config: Dev
      # 本地商店配置（ticket 31）：Run 时**不连真实 App Store**，用这份文件里的商品。
      #
      # 它有两条不可替代的用途：
      #   ① 开发期把购买 / 取消 / 待批准 / 退款 / 恢复整条链路走通 —— 不用建商品、
      #      不用沙盒账号、不用网络；
      #   ② 它能**模拟退款与"移出家人共享"**，而那两种在真实沙盒里几乎造不出来，
      #      偏偏是撤销那套逻辑最需要验的部分。
      #
      # ⚠️ 只有 Run 用它。**真实沙盒交易必须在正式 id 的 Release 构建上验**
      # （商品挂在 bundle id 下，Apple TN3186）—— 见 docs/DEV-VS-PROD.md §3.2。
      storeKitConfiguration: App/Products.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Marquee:
    type: application
    platform: macOS
    sources:
      # `syncedFolder` = Xcode 16+ 的「文件系统同步组」（PBXFileSystemSynchronizedRootGroup）。
      #
      # ⚠️ 别改回普通的 `- path: App/Sources`（那是一堆逐个列出的 `PBXFileReference`）。
      #
      # 踩过的坑（2026-10-01）：新增 `App/Sources/EditorDemo.swift` 之后忘了跑
      # `xcodegen generate`，从 **Xcode 里直接 Run** 就报「找不到 EditorDemo」——
      # 因为 Xcode Run 不会替你重新生成工程，它只读当前的 `.xcodeproj`。
      # 这类问题很隐蔽：文件明明在磁盘上、`git` 里也有，只是工程没引用它。
      #
      # 同步组把目录本身挂进工程，增删源文件**不需要重新生成工程**，从根上去掉这类错误。
      # 只有 `project.yml` 本身（build settings / scheme / 依赖）变了才需要重新生成。
      - path: App/Sources
        type: syncedFolder
      # 文案资源**刻意不放 `App/Sources`**：同步组里的文件由 Xcode 按类型归类，
      # 而 `.xcstrings` 是不是稳当地进 Resources 阶段没有人能替我验证（本机跑不了 xcodebuild）。
      # 显式列出来 + `buildPhase: resources`，归类是生成工程时就定死的，不靠猜。
      - path: App/Resources
        buildPhase: resources
      # 图标资源（ticket 29）。**与 `App/Resources` 分开放、也显式声明**：
      # `.xcassets` 是要过 `actool` 编译的，不能和一堆普通资源混在一个目录里等归类。
      # 同样不走 syncedFolder —— 本机跑不了 xcodebuild，它在不在 Resources 阶段
      # 必须钉在生成工程那一刻（与 `.xcstrings` 同一条理由）。
      - path: App/Assets.xcassets
        buildPhase: resources
      # 本地商店配置（ticket 31）。
      #
      # ⚠️ **必须作为工程里的文件引用存在**：Xcode 的 scheme 编辑器里那个
      # 「StoreKit Configuration」下拉框列的是**工程已知的 .storekit 文件** ——
      # 文件不进工程，下拉就是空的（2026-10-03 首次生成时正是如此：
      # Xcode 里那个引用是红色、且没有默认选中）。
      #
      # 实测确认过：那一版 `Marquee.xcodeproj/project.pbxproj` 里
      # `Products.storekit` 出现 **0 次**。
      #
      # `buildPhase: none` = 只做引用，**不参与任何构建阶段**
      # （它不是要拷进 app 包的资源，只是给 scheme 与 Xcode 编辑器看的）。
      - path: App/Products.storekit
        buildPhase: none
    dependencies:
      - package: MarqueeModules
        product: MarqueeCore
      - package: MarqueeModules
        product: MarqueeCapture
      - package: MarqueeModules
        product: MarqueeOverlay
      - package: MarqueeModules
        product: MarqueeEditor
      - package: MarqueeModules
        product: MarqueeSettings
      - package: MarqueeModules
        product: MarqueeHistory
      # ticket 31：StoreKit 的适配器。只有它 import StoreKit ——
      # 判定与编排都在 Core（可脱机测），这一层只做类型翻译。
      - package: MarqueeModules
        product: MarqueeStore
    settings:
      base:
        PRODUCT_NAME: Marquee
        PRODUCT_BUNDLE_IDENTIFIER: com.tango.marquee
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        # ⚠️ 必须用**证书**签名，不要用 ad-hoc（"-"）。
        #
        # 原因（已实测）：TCC 的屏幕录制授权按「bundle id + 代码签名身份」记账；
        # ad-hoc 没有身份，macOS 只能退回按 cdhash 记账 —— 而每次重新构建 cdhash 都变，
        # 于是每次 Run/构建都被当成一个**新应用**，屏幕录制权限反复索要、勾选也留不住。
        #
        # `DEVELOPMENT_TEAM` 必须是**真正的 team id（UKXWZ3FS84）**。
        # 别把证书名括号里的那串（`Apple Development: … (7H6TJ2PN25)`）填进来 ——
        # 那是证书自身的标识，不是 team id，填错会报
        # `No signing certificate "Mac Development" found`。
        # 查可用身份：`security find-identity -v -p codesigning`
        # 详见 docs/DEV-NOTES.md 第 1 节。
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: UKXWZ3FS84
        # hard runtime：**公证与 App Store 都要求它开**。
        #
        # 为什么放在 base（而不是只给 Release / MAS）：与「Dev 照抄 Release 的优化设置」
        # 同一条理由 —— **本地跑的那个与发版行为一致，问题才会在平时暴露**。
        # 只给发版配置开的话，硬运行时独有的破坏要等到打包那天才发现，
        # 而那正是最不适合发现它的时刻。
        #
        # ⚠️ 它限制的是：加载非同团队签名的库、可写可执行内存（JIT）、
        # DYLD_* 环境变量、无 entitlement 的调试。本项目这几样都不用。
        # 断言（`assert`）不受它影响 —— 那个由**优化级别**决定（见 docs/DEV-VS-PROD.md §4.2）。
        #
        # 历史（2026-10-03）：原先这里是 `NO`，而 `scripts/package.sh` 走的是公证 ——
        # 那条路**必然**会在公证那步被拒，只是 ticket 18 从没真跑过，所以一直没暴露。
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        # 图标（ticket 29）。之前这里是**空串**，等于"这个 app 没有图标" ——
        # 在 Dock / 访达 / App Store 里都会显示成一张白纸。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # 开发身份。Debug 也给 `.dev`：它虽然基本只用于跑测试，
        # 但万一有人用 Debug 起 app，也不该碰到正式版的数据。
        # **只有 Release 拿得到生产 id** —— 于是"误把开发构建发出去"这件事
        # 从"靠人记得"变成"配置上就不可能"（package.sh 另有一道前置检查）。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tango.marquee.dev
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.tango.marquee.dev
        # ── App Store 那条路（ticket 32）────────────────────────────────────
        #
        # **只有这一份带 `CODE_SIGN_ENTITLEMENTS`** —— 也就是说只有它进沙盒。
        # Dev / Debug / Release 都不带，于是自动滚动在那儿照旧可用。
        #
        # bundle id 不用写：它从 `settings.base` 继承正式 id（`com.tango.marquee`），
        # 而只有 Debug / Dev 覆盖成 `.dev`。这正是"只有 Release 与 MAS 拿生产 id"
        # 这条约束的落法 —— 它由**继承关系**保证，不靠人记得。
        MAS:
          CODE_SIGN_ENTITLEMENTS: App/Marquee.entitlements
          # `ENABLE_HARDENED_RUNTIME` 不在这里写 —— 它在 `settings.base` 里已经是 YES，
          # 四份配置都开。重复声明只会让人以为"只有 MAS 才开"。
